apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: finserv-image-baseline
  annotations:
    policies.kyverno.io/title: FinServ Application Image Baseline
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: finserv.io/domain
          operator: In
          values:
            - payments
            - risk-compliance
            - customer
            - platform
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.image.startsWith('ghcr.io/simeonprimordial/'))
      message: >-
        Application images must come from the approved ghcr.io/simeonprimordial registry namespace.
    - expression: >-
        variables.allContainers.all(container, image(container.image).containsDigest())
      message: >-
        Application images must use immutable digest references rather than mutable tags.
