# Pre-stage this policy in each application namespace so an incident responder
# can quarantine a Pod immediately by applying the label:
# security.finserv.io/quarantine=true
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: emergency-quarantine
  namespace: payments
  labels:
    security.finserv.io/purpose: incident-response
spec:
  podSelector:
    matchLabels:
      security.finserv.io/quarantine: "true"
  policyTypes:
    - Ingress
    - Egress
---
