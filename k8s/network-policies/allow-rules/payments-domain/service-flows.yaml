      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              finserv.io/domain: risk-compliance
          podSelector:
            matchLabels:
              app.kubernetes.io/name: risk-scoring-engine
        - namespaceSelector:
            matchLabels:
              finserv.io/domain: risk-compliance
          podSelector:
            matchLabels:
