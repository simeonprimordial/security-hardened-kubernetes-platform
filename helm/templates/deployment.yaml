apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finserv-service.fullname" . }}
  labels:
    {{- include "finserv-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "finserv-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finserv-service.selectorLabels" . | nindent 8 }}
        finserv.io/domain: {{ .Values.domain | quote }}
{{ with .Values.podLabels }}
{{ toYaml . | nindent 8 }}
{{ end }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
{{ if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.destination }}: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-service-account-token-volume-name: "vault-token"
{{ end }}
{{ with .Values.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{ end }}
    spec:
      serviceAccountName: {{ include "finserv-service.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: application
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "finserv-service.fullname" . }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{ if .Values.vault.enabled }}
        - name: vault-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds }}
                  audience: {{ .Values.vault.tokenAudience | quote }}
{{ end }}
      terminationGracePeriodSeconds: 30
