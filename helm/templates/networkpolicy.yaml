{{ if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finserv-service.fullname" . }}
  labels:
    {{- include "finserv-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finserv-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{ if .Values.networkPolicy.ingress }}
  ingress:
{{ range .Values.networkPolicy.ingress }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
{{ with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
{{ end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{ end }}
{{ else }}
  ingress: []
{{ end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{ range .Values.networkPolicy.egress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
{{ with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
{{ end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{ end }}
{{ end }}
